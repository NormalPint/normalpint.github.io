<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 수면 호흡 생리학과 상기도 확장근 훈련에 관한 문서는 자료실에서, 제품의 물리적 규격은 제품 페이지에서 확인하실 수 있습니다.">
<meta name="robots" content="noindex, follow">
<title>페이지를 찾을 수 없습니다 | 코고리스</title>
<meta name="robots" content="noindex, follow">
<style id="site-css">
/* 코고리스 — 공용 스타일. 텍스트 우선, 시맨틱 구조 유지. */

:root{
  --paper:#F5F7F5;
  --raised:#FFFFFF;
  --ink:#17211D;
  --ink-soft:#4C5A54;
  --ink-faint:#83908A;
  --line:#DCE3DF;
  --line-soft:#EAEEEC;
  --accent:#1F6F63;
  --accent-ink:#0E4C43;
  --accent-tint:#E4F1EC;
  --accent-line:#BEDCD2;
  --warn:#A3402F;
  --warn-tint:#F8EAE6;
  --shadow:0 1px 2px rgba(20,30,26,.05), 0 10px 30px -18px rgba(20,30,26,.18);
  --maxw:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111917;
    --raised:#18221F;
    --ink:#E6EDE9;
    --ink-soft:#A6B4AE;
    --ink-faint:#6F7E78;
    --line:#2A3A35;
    --line-soft:#212E2A;
    --accent:#5FC1AE;
    --accent-ink:#8EDAC8;
    --accent-tint:#16302A;
    --accent-line:#2B5048;
    --warn:#E48876;
    --warn-tint:#39211C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#111917; --raised:#18221F; --ink:#E6EDE9; --ink-soft:#A6B4AE;
  --ink-faint:#6F7E78; --line:#2A3A35; --line-soft:#212E2A;
  --accent:#5FC1AE; --accent-ink:#8EDAC8; --accent-tint:#16302A; --accent-line:#2B5048;
  --warn:#E48876; --warn-tint:#39211C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.8; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto}}

h1,h2,h3,h4{font-weight:700; color:var(--ink); line-height:1.4; text-wrap:balance; margin:0}
a{color:var(--accent-ink); text-underline-offset:3px}
a:hover{color:var(--accent)}
img{max-width:100%; height:auto}

.skip{position:absolute; left:-9999px}
.skip:focus{left:8px; top:8px; z-index:99; background:var(--raised); padding:10px 14px; border-radius:8px; border:1px solid var(--line)}

/* ---------- 헤더 ---------- */
.site-head{border-bottom:1px solid var(--line); background:var(--raised)}
.site-head .inner{
  max-width:var(--maxw); margin:0 auto; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; text-decoration:none; color:var(--ink); font-weight:700; font-size:18px}
.brand .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; align-self:center}
.brand small{font-weight:500; font-size:12.5px; color:var(--ink-faint); letter-spacing:.02em}
.site-nav{display:flex; gap:4px; flex-wrap:wrap}
.site-nav a{
  text-decoration:none; color:var(--ink-soft); font-size:14.5px; font-weight:500;
  padding:7px 11px; border-radius:8px;
}
.site-nav a:hover{background:var(--line-soft); color:var(--ink)}
.site-nav a[aria-current="page"]{background:var(--accent-tint); color:var(--accent-ink)}

/* ---------- 레이아웃 ---------- */
.shell{max-width:var(--maxw); margin:0 auto; padding:0 24px 88px}
.doc{max-width:760px; margin:0 auto}
@media (max-width:640px){ .shell{padding:0 18px 64px} body{font-size:16px} }

.crumbs{font-size:13.5px; color:var(--ink-faint); padding:20px 0 0; margin:0}
.crumbs a{color:var(--ink-faint); text-decoration:none}
.crumbs a:hover{color:var(--ink); text-decoration:underline}
.crumbs span{margin:0 6px}

.doc-head{padding:26px 0 30px; border-bottom:1px solid var(--line); margin-bottom:38px}
.kicker{
  display:inline-block; font-size:12.5px; font-weight:600; letter-spacing:.06em;
  color:var(--accent-ink); background:var(--accent-tint); border:1px solid var(--accent-line);
  padding:4px 10px; border-radius:999px; margin-bottom:16px;
}
.doc-head h1{font-size:clamp(26px,4.4vw,36px); margin-bottom:14px}
.summary{font-size:17.5px; color:var(--ink-soft); margin:0}
.summary strong{color:var(--ink); font-weight:600}
.doc-meta{margin-top:18px; font-size:13.5px; color:var(--ink-faint)}

section{margin-bottom:44px; scroll-margin-top:24px}
h2{font-size:23px; margin:0 0 14px; padding-top:6px}
h3{font-size:18px; margin:30px 0 10px}
h4{font-size:16px; margin:22px 0 8px}
p{margin:0 0 16px}
ul,ol{margin:0 0 18px; padding-left:22px}
li{margin-bottom:8px}
li:last-child{margin-bottom:0}
strong{font-weight:600}

/* 두괄식 답변 블록 */
.answer{
  background:var(--accent-tint); border:1px solid var(--accent-line);
  border-radius:12px; padding:16px 20px; margin:0 0 22px;
}
.answer p{margin:0; color:var(--ink)}
.answer p + p{margin-top:10px}

/* ---------- 다이어그램 ---------- */
figure.diagram{margin:0 0 28px}
figure.diagram svg{width:100%; height:auto; display:block}
figure.diagram figcaption{font-size:13.5px; color:var(--ink-faint); margin-top:10px}
.legend{display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:13.5px; color:var(--ink-soft)}
.legend span{display:flex; align-items:center; gap:7px}
.legend i{width:22px; height:12px; border-radius:4px; flex:none; display:block}
.legend i.solid{background:var(--accent-tint); border:1.5px solid var(--accent)}
.legend i.dashed{background:transparent; border:1.5px dashed var(--ink-faint)}

/* ---------- 표 ---------- */
figure.table{margin:0 0 26px}
figure.table figcaption{font-size:13.5px; color:var(--ink-faint); margin-bottom:8px}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--raised)}
table{border-collapse:collapse; width:100%; min-width:520px}
th,td{text-align:left; padding:11px 16px; font-size:15px; border-bottom:1px solid var(--line-soft); vertical-align:top}
thead th{font-size:13px; font-weight:600; color:var(--ink-faint); background:var(--line-soft); letter-spacing:.02em}
tbody tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
td.good{color:var(--accent-ink); font-weight:600}
td.bad{color:var(--warn); font-weight:600}

/* ---------- 콜아웃 ---------- */
.note,.caution{
  border-radius:12px; padding:16px 20px; margin:0 0 24px; font-size:15.5px;
  border:1px solid var(--line); background:var(--line-soft);
}
.caution{background:var(--warn-tint); border-color:transparent}
.note p,.caution p{margin:0; color:var(--ink-soft)}
.note p+p,.caution p+p{margin-top:10px}
.note b,.caution b{color:var(--ink); display:block; margin-bottom:5px; font-size:13px; letter-spacing:.05em}
.caution b{color:var(--warn)}

/* ---------- FAQ ---------- */
.qa{border-top:1px solid var(--line); padding:24px 0}
.qa:last-of-type{border-bottom:1px solid var(--line)}
.qa h3{margin:0 0 10px; font-size:18px}
.qa p:last-child{margin-bottom:0}

/* ---------- 카드 ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:0 0 30px}
.card{
  display:block; text-decoration:none; color:inherit; background:var(--raised);
  border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow);
}
.card:hover{border-color:var(--accent-line)}
.card h3{margin:0 0 7px; font-size:17px; color:var(--ink)}
.card p{margin:0; font-size:14.5px; color:var(--ink-soft); line-height:1.65}
.card .tag{font-size:12px; color:var(--ink-faint); letter-spacing:.05em; display:block; margin-bottom:9px}

/* ---------- 참고문헌 ---------- */
ol.refs{padding-left:20px; font-size:14.5px; color:var(--ink-soft); line-height:1.7}
ol.refs li{margin-bottom:12px}
ol.refs cite{font-style:normal; color:var(--ink)}

/* ---------- 다음 단계 링크 ---------- */
.onward{
  border-top:1px solid var(--line); margin-top:8px; padding-top:22px;
  font-size:15.5px; color:var(--ink-soft);
}
.onward a{font-weight:600}

/* ---------- 제품 사진 ---------- */
figure.shot{margin:0 0 26px}
figure.shot img, figure.shot video{
  width:100%; height:auto; display:block; border-radius:12px;
  background:var(--line-soft); border:1px solid var(--line);
}
figure.shot figcaption{font-size:13.5px; color:var(--ink-faint); margin-top:9px}
.shot-pair{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0 0 26px}
@media (max-width:560px){ .shot-pair{grid-template-columns:1fr} }
.shot-pair figure{margin:0}
.shot-pair figcaption{text-align:center}
figure.shot.narrow{max-width:420px}

/* ---------- 제품 페이지 ---------- */
.spec dt{font-size:13px; color:var(--ink-faint); letter-spacing:.04em; margin-top:14px}
.spec dd{margin:2px 0 0; font-size:16px}
.todo{
  background:var(--warn-tint); color:var(--warn); border:1px dashed var(--warn);
  border-radius:6px; padding:1px 7px; font-size:13.5px; font-weight:600; white-space:nowrap;
}
.buy{
  display:inline-block; background:var(--accent); color:#FFFFFF; text-decoration:none;
  font-weight:600; padding:13px 26px; border-radius:10px; font-size:16px; margin:6px 0 0;
}
.buy:hover{background:var(--accent-ink); color:#FFFFFF}

/* ---------- 푸터 ---------- */
.site-foot{border-top:1px solid var(--line); background:var(--raised); margin-top:40px}
.site-foot .inner{max-width:var(--maxw); margin:0 auto; padding:34px 24px 44px; font-size:14px; color:var(--ink-soft)}
.site-foot .disclose{
  border-left:3px solid var(--accent-line); padding-left:14px; margin:0 0 22px; max-width:620px;
}
.site-foot nav{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:16px}
.site-foot nav a{color:var(--ink-soft); text-decoration:none}
.site-foot nav a:hover{color:var(--ink); text-decoration:underline}
.site-foot .fine{font-size:13px; color:var(--ink-faint); margin:0}
</style>
</head>

<div class="shell">
<main id="main" class="doc">
  <div class="doc-head">

  </div>

  <div class="cards">
    <a class="card" href="/learn/mechanism/">
      <span class="tag">호흡 원리</span>
      <h3>수면 중 상기도는 왜 좁아지는가</h3>
      <p>코골이 발생의 4단계와 진동 부위별 특징.</p>
    </a>

      <span class="tag">연구 근거</span>

    <a class="card" href="/product/">

</main>
</div>

<footer class="site-foot">
  <div class="inner">

  </div>

</body>
